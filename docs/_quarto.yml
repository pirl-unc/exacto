project:
  type: website
  output-dir: _site

website:
  title: "Exacto"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: pipelines/index.qmd
        text: Pipelines
      - href: cli/index.qmd
        text: Commands
      - href: faq.qmd
        text: FAQ
    right:
      - icon: github
        href: https://github.com/pirl-unc/exacto
  sidebar:
    style: docked
    contents:
      - text: Home
        href: index.qmd
      - section: Pipelines
        contents:
          - pipelines/index.qmd
          - pipelines/mutant-proteoform-prediction.qmd
          - pipelines/variation-graph-construction.qmd
      - section: Commands
        contents:
          - cli/index.qmd
          - auto: cli/*.qmd
      - text: FAQ
        href: faq.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
