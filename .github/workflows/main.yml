name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        miniconda-version: "latest"
        activate-environment: test-env
        python-version: "3.10"

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        # Remove tmp files
        sudo rm -rf /tmp/*

        # Install conda packages
        pip install pysam==0.23.0
        conda install -c conda-forge rust==1.86.0
        conda install -c anaconda pandas==2.2.3
        conda install -c conda-forge polars==1.26.0
        conda install -c conda-forge pyarrow==19.0.1
        conda install -c anaconda pylint==3.3.5
        conda install -c conda-forge coveralls==4.0.1
        conda install -c conda-forge pytest==8.3.5
        conda install -c conda-forge pytest-cov==6.1.1
        
        
        # Install exacto
        pip install . --verbose

    - name: Run linter
      shell: bash -l {0}
      run: |
        chmod +x lint.sh
        bash lint.sh

    - name: Run unit tests
      shell: bash -l {0}
      run: |
        chmod +x unittest.sh
        bash unittest.sh
