[package]
name = "exacto-annotator"
version = "0.4.5"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
exacto-caller = { path = "../exacto-caller", version = "0.4.5" }
exacto-core = { path = "../exacto-core", version = "0.4.5" }
bio = "2.0.3"
flate2 = "1.0.35"
indicatif = "0.17"
noodles-bgzf = "0.43.0"
noodles-fasta = "0.56.0"
once_cell = "1.20.2"
phf = { version = "0.11", features = ["macros"] }
polars = { version = "0.45.0", features = ["csv","decompress","json","lazy","parquet","serde"] }
rayon = "1.10.0"
serde = { version = "1.0.210", features = ["derive"] }
tempfile = "3.6"

[profile.dev]
opt-level = 0

[profile.release]
incremental = true