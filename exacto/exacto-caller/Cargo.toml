[package]
name = "exacto-caller"
version = "0.4.0"
edition = "2021"

[dependencies]
exacto-util = { path = "../exacto-util", version = "0.4.0" }
bimap = { version = "0.6.3", features = ["serde"] }
bincode = "1.3"
bio = "2.0.3"
bstr = "1.10.0"
chrono = "0.4.38"
csv = "1.3.0"
edit-distance = "2.1.3"
env_logger = "0.10"
flate2 = "1.0.35"
interavl = "0.2.0"
log = "0.4.22"
noodles-core = "0.15.0"
noodles-bam = "0.72.0"
noodles-bgzf = "0.34.0"
noodles-fasta = "0.46.0"
noodles-sam = "0.68.0"
once_cell = "1.10"
polars = { version = "0.45.0", features = ["csv","decompress","json","lazy","parquet","serde"] }
rayon = "1.10.0"
serde = { version = "1.0.210", features = ["derive"] }
sysinfo = "0.32.0"
tempfile = "3.6"
regex = "1.10.6"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
panic = 'unwind'
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = false
lto = true
overflow-checks = false
panic = 'unwind'
incremental = true
codegen-units = 1
