[package]
name = "exactolib"
version = "0.3.1"
edition = "2021"

[package.metadata.maturin]
name = "exactolib.exactolibrs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "exactolib"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.17.3", features = ["extension-module"] }
bstr = "1.9.0"
chrono = "0.4"
edit-distance = "2.1.0"
env_logger = "0.9"
exitcode = "1.1.2"
log = "0.4"
noodles = { version = "0.62.1", features = ["bam"] }
noodles-core = "0.14.0"
noodles-sam = "0.51.0"
rayon = "1.8.0"
regex = "1.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
debug = 0
incremental = true
