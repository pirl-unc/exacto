[package]
name = "exactolib"
version = "0.4.6"
edition = "2021"

[package.metadata.maturin]
name = "exactolib.exactolibrs"

[lib]
name = "exactolibrs"
crate-type = ["cdylib"]

[dependencies]
bstr = "1.9.0"
chrono = "0.4"
env_logger = "0.9"
exacto = { path = "exacto/exacto", version = "0.4.6" }
exitcode = "1.1.2"
flate2 = "1.0.35"
log = "0.4"
noodles-bgzf = "0.43.0"
noodles-fasta = "0.56.0"
noodles-fastq = "0.16.0"
polars = { version = "0.45.0", features = ["csv", "ipc", "lazy", "parquet"] }
pyo3 = { version = "0.22.0", features = ["extension-module"] }
pyo3-polars = "0.19.0"
rayon = "1.10.0"
serde = { version = "1.0.210", features = ["derive", "rc"] }
sysinfo = "0.32.0"
tempfile = "3.6"

[profile.dev]
opt-level = 0
debug = 1
overflow-checks = true
panic = 'unwind'
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = 0
lto = "thin"
overflow-checks = false
panic = 'unwind'
incremental = false
codegen-units = 16
